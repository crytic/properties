name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  foundry-root:
    name: Compile root contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run forge build
        run: forge build

  foundry-tests:
    name: Compile ${{ matrix.standard }} test harness (Foundry)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        standard: [ERC20, ERC721, ERC4626]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run forge build
        working-directory: tests/${{ matrix.standard }}/foundry
        run: forge build

  hardhat-root:
    name: Compile root contracts (Hardhat)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run hardhat compile
        run: npx hardhat compile

  hardhat-tests:
    name: Compile ${{ matrix.standard }} test harness (Hardhat)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        standard: [ERC20, ERC721, ERC4626]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: tests/${{ matrix.standard }}/hardhat
        run: npm install

      - name: Run hardhat compile
        working-directory: tests/${{ matrix.standard }}/hardhat
        run: npx hardhat compile
